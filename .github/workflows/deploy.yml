# Manual only. The public GitHub Pages site fetches the OSRS Wiki API directly
# in the visitor's browser. This workflow is not needed for price updates.
name: Validar codigo (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes do analisador e parser
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_*.py'
